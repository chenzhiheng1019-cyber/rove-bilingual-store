<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="ROVE urban outdoor footwear. Built for trails. Designed for everywhere." />
    <link rel="icon" href="/favicon.svg" />

    <!--
      The hero is a CSS background-image, so the browser only discovers it after
      the stylesheet has been parsed and applied — that is why the first screen
      used to pop in late. Preloading starts the download in parallel with the
      CSS and JS. Each hint must point at the SAME file the CSS will choose for
      that breakpoint, otherwise the browser downloads two images.
        desktop -> image-set 1x = campaign-1024
        mobile  -> image-set 1x = campaign-640
    -->
    <link rel="preload" as="image" href="/assets/campaign-1024.webp" fetchpriority="high" media="(min-width: 801px)" />
    <link rel="preload" as="image" href="/assets/campaign-640.webp" fetchpriority="high" media="(max-width: 800px)" />

    <meta name="theme-color" content="#f5f5f2" />
    <title>ROVE — Move Beyond | Urban Outdoor Footwear</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
